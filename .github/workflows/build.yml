name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # Gradle caches the resolved dependency graph between runs, which is the
      # real fix for Maven Central 429s: after the first green build the
      # artifacts come from cache, not the network.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK (signed with debug key)
        env:
          # Ask Gradle for patience on flaky/rate-limited mirrors.
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
            -Dorg.gradle.internal.repository.max.retries=6
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: flutter build apk --release

      - name: Sign APK with debug keystore
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          test -x "$BT/zipalign" || { echo "zipalign missing"; ls "$BT"; exit 1; }
          test -x "$BT/apksigner" || { echo "apksigner missing"; ls "$BT"; exit 1; }

          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/unsigned.apk

          "$BT/zipalign" -v -p 4 out/unsigned.apk out/aligned.apk

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out out/jayp-v1.0.apk \
            out/aligned.apk

          echo "=== signature verification ==="
          "$BT/apksigner" verify --verbose --print-certs out/jayp-v1.0.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jayp-apk
          path: out/jayp-v1.0.apk
          retention-days: 90
